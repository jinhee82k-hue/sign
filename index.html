<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 연수 등록부</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f0fdf4; padding: 15px; color: #333; }
    
    /* 상단 배너 카드 (초록색 그라데이션) */
    .header-card {
      background: linear-gradient(135deg, #dcfce7 0%, #ffffff 100%);
      border-radius: 24px; padding: 25px 20px; text-align: center;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.08); margin-bottom: 15px;
    }
    .badge { display: inline-block; background: #bbf7d0; color: #15803d; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    .title { font-size: 28px; font-weight: 900; color: #16a34a; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #4b5563; }

    /* 탭 버튼 */
    .tab-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 14px; border: none; border-radius: 16px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .tab-active { background: #16a34a; color: white; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); }
    .tab-inactive { background: white; color: #16a34a; border: 1px solid #dcfce7; }

    /* 메인 카드 */
    .content-card { background: white; border-radius: 24px; padding: 25px 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.03); }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #374151; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 14px; background: #f9fafb; outline: none; }
    .input-group input:focus { border-color: #16a34a; background: #fff; }

    canvas { width: 100%; height: 130px; border: 1px dashed #9ca3af; border-radius: 12px; background: #f9fafb; touch-action: none; }
    .clear-link { display: inline-block; font-size: 12px; color: #ef4444; margin-top: 5px; cursor: pointer; text-decoration: underline; }

    .submit-btn { width: 100%; padding: 15px; background: #16a34a; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 15px rgba(22, 163, 74, 0.2); }

    /* 관리자 명단 테이블 */
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .admin-table th, .admin-table td { border-bottom: 1px solid #f3f4f6; padding: 10px 5px; text-align: center; }
    .admin-table th { background: #f0fdf4; color: #16a34a; }
    .sig-img { width: 80px; height: auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="header-card">
    <div class="badge">✍️ 온라인 연수 등록부</div>
    <div class="title">SIGN-ON</div>
    <div class="subtitle">온라인에서 편하게 서명하세요.</div>
  </div>

  <div class="tab-group">
    <button id="btn-user" class="tab-btn tab-active" onclick="switchTab('user')">참가자 서명</button>
    <button id="btn-admin" class="tab-btn tab-inactive" onclick="switchTab('admin')">관리자</button>
  </div>

  <!-- 참가자 등록 화면 -->
  <div id="view-user" class="content-card">
    <div class="input-group">
      <label>이름</label>
      <input type="text" id="name" placeholder="이름 입력">
    </div>
    <div class="input-group">
      <label>소속 (학교/기관명)</label>
      <input type="text" id="org" placeholder="소속 입력">
    </div>
    <div class="input-group">
      <label>참가자 서명</label>
      <canvas id="signature-pad"></canvas>
      <span class="clear-link" onclick="clearCanvas()">서명 다시 하기</span>
    </div>
    <button class="submit-btn" onclick="sendData()">등록 완료하기</button>
  </div>

  <!-- 관리자 목록 화면 -->
  <div id="view-admin" class="content-card" style="display: none;">
    <h3 style="margin-bottom: 15px; color: #16a34a;">📋 등록자 명단</h3>
    <button onclick="loadAdminData()" style="padding: 6px 12px; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px;">🔄 새로고침</button>
    <div style="overflow-x: auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>이름</th>
            <th>소속</th>
            <th>서명</th>
          </tr>
        </thead>
        <tbody id="admin-list">
          <tr><td colspan="3">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ★ 3단계에서 복사한 앱스스크립트 주소를 아래 큰따옴표 안에 붙여넣으세요!
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzkqkiFOlFT_rJqSjpEZXdrDdJKyYQu9RoT1r_U3GRqfy2txYHVa4B-POoLC5124xk/exec";
    
    // ★ 관리자 비밀번호 (원하는 비밀번호로 바꾸셔도 됩니다)
    const ADMIN_PASSWORD = "1234";

    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    window.addEventListener('load', resizeCanvas);

    function startDrawing(e) { isDrawing = true; draw(e); }
    function stopDrawing() { isDrawing = false; ctx.beginPath(); }
    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1f2937';
      ctx.lineTo(clientX - rect.left, clientY - rect.top); ctx.stroke(); ctx.beginPath(); ctx.moveTo(clientX - rect.left, clientY - rect.top);
    }

    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mouseup', stopDrawing); canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDrawing); canvas.addEventListener('touchend', stopDrawing); canvas.addEventListener('touchmove', draw);

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function switchTab(tab) {
      if (tab === 'admin') {
        const pwd = prompt('관리자 비밀번호를 입력해 주세요:');
        if (pwd !== ADMIN_PASSWORD) {
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }
        document.getElementById('view-user').style.display = 'none';
        document.getElementById('view-admin').style.display = 'block';
        document.getElementById('btn-user').className = 'tab-btn tab-inactive';
        document.getElementById('btn-admin').className = 'tab-btn tab-active';
        loadAdminData();
      } else {
        document.getElementById('view-user').style.display = 'block';
        document.getElementById('view-admin').style.display = 'none';
        document.getElementById('btn-user').className = 'tab-btn tab-active';
        document.getElementById('btn-admin').className = 'tab-btn tab-inactive';
      }
    }

    function sendData() {
      const name = document.getElementById('name').value;
      const org = document.getElementById('org').value;
      const signature = canvas.toDataURL();
      if (!name || !org) return alert('이름과 소속을 모두 입력해 주세요!');

      alert('등록 처리 중입니다...');
      fetch(GAS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, org: org, signature: signature })
      }).then(() => {
        alert('성공적으로 등록되었습니다!');
        clearCanvas(); document.getElementById('name').value = ''; document.getElementById('org').value = '';
      });
    }

    function loadAdminData() {
      const tbody = document.getElementById('admin-list');
      tbody.innerHTML = '<tr><td colspan="3">로딩 중...</td></tr>';
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          tbody.innerHTML = '';
          if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3">등록된 참가자가 없습니다.</td></tr>';
            return;
          }
          data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${item.name}</b></td><td>${item.org}</td><td><img src="${item.signature}" class="sig-img"></td>`;
            tbody.appendChild(tr);
          });
        })
        .catch(() => tbody.innerHTML = '<tr><td colspan="3">목록을 불러오지 못했습니다.</td></tr>');
    }
  </script>
</body>
</html>
